[package]
name = "rmus-podcast"
version = "0.3.3"
edition = "2024"
description = "rmus 播客模块：RSS 订阅 / 单集浏览 / 下载与连播"
license = "MIT"
publish = false

[dependencies]
rmus-plugin-sdk = { path = "../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# feed 解析（RSS 2.0 + iTunes namespace）；纯 Rust，事件流式读
quick-xml = "0.37"
