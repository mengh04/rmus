[package]
name = "rmus-plugin-sdk"
version = "0.2.0"
edition = "2024"
description = "rmus 原生插件 SDK 与运行时上下文：UI 画布、HTTP、文件、daemon RPC、后台任务"
license = "MIT"

[features]
# 实现 lofty::io::Truncate/Length（tag 写入库需要；详见 fs::File 文档）
lofty-io = ["dep:lofty"]

[dependencies]
serde_json = "1"
anyhow = "1"
# 显示宽度计算（fit/pad 列对齐；与宿主渲染器同一 crate 保证规则一致）
unicode-width = "0.2"
# 原生 HTTP 客户端（支持 cookies + 系统代理 + socks 代理）
ureq = { version = "2", features = ["cookies", "proxy-from-env", "socks-proxy"] }
lofty = { version = "0.25", optional = true }
