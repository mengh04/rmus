[package]
name = "rmus-dl"
version = "0.2.0"
edition = "2024"
description = "rmus wasm 下载插件：酷我/酷狗搜索 + 下载（rmus-dl 的 wasm 移植）"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
rmus-plugin-sdk = { path = "../plugin-sdk", features = ["lofty-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
# 元数据（歌词/封面）写 tag；纯 Rust，经 SDK File 的 Read+Seek+Write 代理
lofty = "0.25"
